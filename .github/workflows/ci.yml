name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Deno is required for pkg/runtime/deno integration tests (e.g.
      # TestRun_SecretOutputRoutedToChannel). Without it those tests t.Skip
      # silently and a regression in the runtime IPC path goes uncaught.
      # See issue #237.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Python is required for the dicode_sdk.py unit tests
      # (TestPythonSDK in pkg/runtime/python). Without it the wrapper
      # t.Skip's silently and SDK regressions go uncaught. See issue #39.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run tests
        run: go test -timeout 300s -race ./...

  test-tasks:
    name: Test tasks (Deno)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run Deno tests for tasks/buildin/*
        run: deno test --allow-all --config=tasks/deno.json 'tasks/buildin/**/task.test.ts'

  test-tasks-cli:
    name: Test buildin tasks (dicode CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DICODE_DATA_DIR: /tmp/dicode-ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build dicode binary
        run: go build -o dicode ./cmd/dicode

      - name: Start daemon and run task tests
        run: |
          set -euo pipefail
          mkdir -p "$DICODE_DATA_DIR"

          # Assemble the CI config: base file + spec entry that needs the
          # absolute workspace path (${CONFIGDIR} won't reach tasks/ from ci/).
          cat ci/dicode-tasktest.yaml > "$DICODE_DATA_DIR/dicode-ci.yaml"
          cat >> "$DICODE_DATA_DIR/dicode-ci.yaml" <<SPECEOF
          data_dir: $DICODE_DATA_DIR
          spec:
            entries:
              buildin:
                ref:
                  path: $GITHUB_WORKSPACE/tasks/buildin/taskset.yaml
                  watch: false
          SPECEOF

          ./dicode daemon --config "$DICODE_DATA_DIR/dicode-ci.yaml" \
            > "$DICODE_DATA_DIR/daemon.log" 2>&1 &
          DAEMON_PID=$!
          trap "kill $DAEMON_PID 2>/dev/null || true" EXIT

          # Wait for IPC socket readiness (max 30 s, 0.5 s poll).
          # Poll the socket, not HTTP — the CLI communicates via IPC and we
          # need that path ready before invoking `dicode task test`.
          for i in $(seq 1 60); do
            test -S "$DICODE_DATA_DIR/daemon.sock" && break
            if [ "$i" -eq 60 ]; then
              echo "Daemon did not become ready in 30 s"
              echo "=== daemon log ==="
              cat "$DICODE_DATA_DIR/daemon.log"
              exit 1
            fi
            sleep 0.5
          done

          ./dicode task test buildin/webui --format=junit \
            > "$RUNNER_TEMP/buildin-webui.xml"

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: task-test-results
          path: ${{ runner.temp }}/buildin-webui.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Upload daemon log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: daemon-log
          path: ${{ env.DICODE_DATA_DIR }}/daemon.log
          retention-days: 3

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files need formatting:"
            echo "$unformatted"
            exit 1
          fi

  build-pr:
    name: Build PR artifacts
    if: github.event_name == 'pull_request'
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      url-linux-amd64:   ${{ steps.upload-linux-amd64.outputs.artifact-url }}
      url-linux-arm64:   ${{ steps.upload-linux-arm64.outputs.artifact-url }}
      url-darwin-amd64:  ${{ steps.upload-darwin-amd64.outputs.artifact-url }}
      url-darwin-arm64:  ${{ steps.upload-darwin-arm64.outputs.artifact-url }}
      url-windows-amd64: ${{ steps.upload-windows-amd64.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: build --clean --snapshot
        env:
          GORELEASER_CURRENT_TAG: pr-${{ github.event.pull_request.number }}

      - name: List dist
        run: find dist -type f | sort

      - name: Upload linux/amd64
        id: upload-linux-amd64
        uses: actions/upload-artifact@v7
        with:
          name: dicode-linux-amd64
          path: dist/dicode_linux_amd64_v1/dicode
          retention-days: 7

      - name: Upload linux/arm64
        id: upload-linux-arm64
        uses: actions/upload-artifact@v7
        with:
          name: dicode-linux-arm64
          path: dist/dicode_linux_arm64/dicode
          retention-days: 7

      - name: Upload darwin/amd64
        id: upload-darwin-amd64
        uses: actions/upload-artifact@v7
        with:
          name: dicode-darwin-amd64
          path: dist/dicode_darwin_amd64_v1/dicode
          retention-days: 7

      - name: Upload darwin/arm64
        id: upload-darwin-arm64
        uses: actions/upload-artifact@v7
        with:
          name: dicode-darwin-arm64
          path: dist/dicode_darwin_arm64/dicode
          retention-days: 7

      - name: Upload windows/amd64
        id: upload-windows-amd64
        uses: actions/upload-artifact@v7
        with:
          name: dicode-windows-amd64
          path: dist/dicode_windows_amd64_v1/dicode.exe
          retention-days: 7

  comment-pr:
    name: Comment artifacts on PR
    if: github.event_name == 'pull_request'
    needs: build-pr
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post sticky comment
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: build-artifacts
          message: |
            ## Build Artifacts

            Dev binaries for `${{ github.event.pull_request.head.sha }}`:

            | Platform | Download |
            | --- | --- |
            | linux/amd64 | [dicode-linux-amd64](${{ needs.build-pr.outputs.url-linux-amd64 }}) |
            | linux/arm64 | [dicode-linux-arm64](${{ needs.build-pr.outputs.url-linux-arm64 }}) |
            | darwin/amd64 | [dicode-darwin-amd64](${{ needs.build-pr.outputs.url-darwin-amd64 }}) |
            | darwin/arm64 (Apple Silicon) | [dicode-darwin-arm64](${{ needs.build-pr.outputs.url-darwin-arm64 }}) |
            | windows/amd64 | [dicode-windows-amd64.exe](${{ needs.build-pr.outputs.url-windows-amd64 }}) |

            > Artifacts expire after 7 days.
