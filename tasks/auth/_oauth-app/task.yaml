apiVersion: dicode/v1
kind: Task
name: OAuth
description: |
  Generic OAuth 2.0 task — the BYO entry point for any provider that the
  dicode-relay broker does not handle for you (e.g. self-hosted GitLab,
  niche enterprise IdPs, or any provider you would rather not route through
  the broker). Supports PKCE-only, PKCE + client secret, and secret-only
  flows, plus silent refresh and chain-aware notification.

  Do not run this task directly — it has no built-in provider config.
  Instantiate it via a taskset entry in your OWN taskset with provider-
  specific overrides. See `../taskset.yaml` header for a step-by-step
  `my-looker-oauth` BYO walkthrough.

  Once instantiated, the dashboard's auth-providers panel auto-discovers
  the entry via the `template: dicode.io/oauth-app` marker — no
  configuration needed on the panel side.
runtime: deno
trigger:
  webhook: /hooks/oauth
permissions:
  env:
    - DICODE_BASE_URL   # optional — defaults to http://localhost:8080
    # Default param values — taskset overrides replace these with provider-specific names.
    # Both the defaults and the overrides must be in --allow-env so Deno can read them.
    - CLIENT_ID
    - CLIENT_SECRET
    - ACCESS_TOKEN
    - REFRESH_TOKEN
  net:
    - "*"  # restricted per provider via overrides.net
  fs:
    - path: ../_oauth
      permission: r
  dicode:
    secrets_write: true
    tasks:
      - buildin/notifications
params:
  provider:
    type: string
    default: ""
    description: Provider key passed to the generic script (set via overrides, not by the user)
  client_id_env:
    type: string
    default: "CLIENT_ID"
    description: Env var name holding the client ID
  client_secret_env:
    type: string
    default: ""
    description: Env var name holding the client secret (empty = PKCE-only)
  access_token_env:
    type: string
    default: "ACCESS_TOKEN"
    description: Env var name to read existing access token from
  refresh_token_env:
    type: string
    default: "REFRESH_TOKEN"
    description: Env var name to read existing refresh token from
  scope:
    type: string
    default: ""
    description: Space-separated OAuth scopes to request
  color:
    type: string
    default: "#333"
    description: Brand color for the authorize button
  token_lifetime:
    type: string
    default: "expires"
    description: "expires (token has expires_in) | permanent (never expires, skip refresh check)"
timeout: 30s
