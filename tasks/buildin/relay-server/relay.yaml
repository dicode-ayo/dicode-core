# Shipped dicode-relay config template for buildin/relay-server.
#
# All ${VAR} placeholders resolve against process.env (which the daemon
# populates from this task's permissions.env at spawn). Two values are
# pinned for the dicode-core integration:
#
#   server.base_url       — set from the task's `base_url` param, exposed
#                           as BASE_URL by task.ts.
#   broker.signing_key_file — pinned under DICODE_DATADIR so the broker's
#                           ECDSA signing key persists across task restarts
#                           (otherwise existing sessions would be invalidated
#                           every time the daemon reconciles this task).
#
# All other secrets (STATUS_PASSWORD, <PROVIDER>_CLIENT_ID,
# <PROVIDER>_CLIENT_SECRET) flow in from Doppler via the
# buildin/secret-providers/doppler task. Providers whose client_id
# resolves to empty are silently skipped by the relay.

server:
  port: 5553
  base_url: ${BASE_URL}
  tls:
    cert_file: ""
    key_file: ""

status:
  password: ${STATUS_PASSWORD}

relay:
  timestamp_tolerance_s: 30
  ping_interval_ms: 30000
  pong_timeout_ms: 10000
  request_timeout_ms: 30000
  nonce_ttl_ms: 60000

broker:
  session_ttl_ms: 300000
  # Persist across task restarts so existing sessions survive.
  signing_key_file: ${DICODE_DATADIR}/relay/broker-signing.key

  # OAuth providers — mirrors relay.yaml.example. Each entry whose
  # client_id resolves to empty is silently skipped by the relay, so a
  # partial Doppler config still produces a working relay with only the
  # providers you populated.
  providers:
    github:
      client_id: ${GITHUB_CLIENT_ID}
      client_secret: ${GITHUB_CLIENT_SECRET}
      pkce: true
      scopes: [user, repo]

    slack:
      client_id: ${SLACK_CLIENT_ID}
      pkce: true
      scopes: [channels:read]

    google:
      client_id: ${GOOGLE_CLIENT_ID}
      client_secret: ${GOOGLE_CLIENT_SECRET}
      pkce: true
      scopes: ["https://www.googleapis.com/auth/userinfo.email"]

    spotify:
      client_id: ${SPOTIFY_CLIENT_ID}
      pkce: true
      scopes: [user-read-private, user-read-email]

    linear:
      client_id: ${LINEAR_CLIENT_ID}
      pkce: true
      scopes: [read]

    discord:
      client_id: ${DISCORD_CLIENT_ID}
      pkce: true
      scopes: [identify, email]

    gitlab:
      client_id: ${GITLAB_CLIENT_ID}
      client_secret: ${GITLAB_CLIENT_SECRET}
      pkce: true
      scopes: [read_user, read_api]

    airtable:
      client_id: ${AIRTABLE_CLIENT_ID}
      client_secret: ${AIRTABLE_CLIENT_SECRET}
      pkce: true
      scopes: ["data.records:read"]

    notion:
      client_id: ${NOTION_CLIENT_ID}
      client_secret: ${NOTION_CLIENT_SECRET}
      pkce: false
      scopes: []

    confluence:
      client_id: ${CONFLUENCE_CLIENT_ID}
      pkce: true
      scopes: ["read:me", "read:confluence-content.all", offline_access]

    salesforce:
      client_id: ${SALESFORCE_CLIENT_ID}
      pkce: true
      scopes: [api, refresh_token]

    stripe:
      client_id: ${STRIPE_CLIENT_ID}
      client_secret: ${STRIPE_CLIENT_SECRET}
      pkce: false
      scopes: [read_write]

    office365:
      client_id: ${OFFICE365_CLIENT_ID}
      client_secret: ${OFFICE365_CLIENT_SECRET}
      pkce: true
      scopes: [offline_access, User.Read, Mail.Read]

    azure:
      client_id: ${AZURE_CLIENT_ID}
      client_secret: ${AZURE_CLIENT_SECRET}
      pkce: true
      scopes: [openid, profile, email, offline_access]
