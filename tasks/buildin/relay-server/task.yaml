apiVersion: dicode/v1
kind: Task
name: "Relay Server"
description: |
  Runs dicode-relay in-process under the daemon's Deno runtime.

  The relay's config (relay.yaml) is rendered by a 2-stage preflight
  pipeline before this daemon starts:

    1. buildin/template renders the YAML body, substituting
       ${BASE_URL}, ${STATUS_PASSWORD}, and per-provider OAuth
       client_id/client_secret values from the env declared below
       (mix of literal value and Doppler-fed entries).

    2. buildin/write-local persists the rendered string to
       ${DATADIR}/relay/relay.yaml at mode 0600.

  Doppler rotation: re-run the renderer manually (e.g. via the WebUI
  or 'dicode tasks run buildin/template' with the per-edge overrides
  applied) — the engine re-fires the writer with fresh content and
  restarts this daemon.

  Operator setup (one-time): edit the BASE_URL value below to the
  public hostname the relay is reachable at (or apply a taskset
  override to that specific env entry). DOPPLER_TOKEN must be in
  the dicode secrets store before first daemon start.

runtime: deno

trigger:
  daemon: true
  restart: always
  before:
    - task: buildin/template
      overrides:
        timeout: 30s
        params:
          # The template body below is inlined here because buildin/template
          # only accepts a `template: <string>` param. A future buildin/template
          # `template_path:` param would let this body live in a sibling YAML
          # file. Tracked as a follow-up to PR #311.
          template: |
            server:
              port: 5553
              base_url: ${BASE_URL}
              tls:
                cert_file: ""
                key_file: ""
            status:
              password: ${STATUS_PASSWORD}
            relay:
              timestamp_tolerance_s: 30
              ping_interval_ms: 30000
              pong_timeout_ms: 10000
              request_timeout_ms: 30000
              nonce_ttl_ms: 60000
            broker:
              session_ttl_ms: 300000
              signing_key_file: ${DICODE_DATADIR}/relay/broker-signing.key
              providers:
                github:
                  client_id: ${GITHUB_CLIENT_ID}
                  client_secret: ${GITHUB_CLIENT_SECRET}
                  pkce: true
                  scopes: [user, repo]
                slack:
                  client_id: ${SLACK_CLIENT_ID}
                  pkce: true
                  scopes: [channels:read]
                google:
                  client_id: ${GOOGLE_CLIENT_ID}
                  client_secret: ${GOOGLE_CLIENT_SECRET}
                  pkce: true
                  scopes: ["https://www.googleapis.com/auth/userinfo.email"]
                spotify:
                  client_id: ${SPOTIFY_CLIENT_ID}
                  pkce: true
                  scopes: [user-read-private, user-read-email]
                linear:
                  client_id: ${LINEAR_CLIENT_ID}
                  pkce: true
                  scopes: [read]
                discord:
                  client_id: ${DISCORD_CLIENT_ID}
                  pkce: true
                  scopes: [identify, email]
                gitlab:
                  client_id: ${GITLAB_CLIENT_ID}
                  client_secret: ${GITLAB_CLIENT_SECRET}
                  pkce: true
                  scopes: [read_user, read_api]
                airtable:
                  client_id: ${AIRTABLE_CLIENT_ID}
                  client_secret: ${AIRTABLE_CLIENT_SECRET}
                  pkce: true
                  scopes: ["data.records:read"]
                notion:
                  client_id: ${NOTION_CLIENT_ID}
                  client_secret: ${NOTION_CLIENT_SECRET}
                  pkce: false
                  scopes: []
                confluence:
                  client_id: ${CONFLUENCE_CLIENT_ID}
                  pkce: true
                  scopes: ["read:me", "read:confluence-content.all", offline_access]
                salesforce:
                  client_id: ${SALESFORCE_CLIENT_ID}
                  pkce: true
                  scopes: [api, refresh_token]
                stripe:
                  client_id: ${STRIPE_CLIENT_ID}
                  client_secret: ${STRIPE_CLIENT_SECRET}
                  pkce: false
                  scopes: [read_write]
                office365:
                  client_id: ${OFFICE365_CLIENT_ID}
                  client_secret: ${OFFICE365_CLIENT_SECRET}
                  pkce: true
                  scopes: [offline_access, User.Read, Mail.Read]
                azure:
                  client_id: ${AZURE_CLIENT_ID}
                  client_secret: ${AZURE_CLIENT_SECRET}
                  pkce: true
                  scopes: [openid, profile, email, offline_access]
        env:
          - name: DICODE_DATADIR
          - name: BASE_URL
            value: "https://relay.example.com"
          - name: STATUS_PASSWORD
            from: task:secret-providers/doppler
          - name: GITHUB_CLIENT_ID
            from: task:secret-providers/doppler
            optional: true
          - name: GITHUB_CLIENT_SECRET
            from: task:secret-providers/doppler
            optional: true
          - name: SLACK_CLIENT_ID
            from: task:secret-providers/doppler
            optional: true
          - name: GOOGLE_CLIENT_ID
            from: task:secret-providers/doppler
            optional: true
          - name: GOOGLE_CLIENT_SECRET
            from: task:secret-providers/doppler
            optional: true
          - name: SPOTIFY_CLIENT_ID
            from: task:secret-providers/doppler
            optional: true
          - name: LINEAR_CLIENT_ID
            from: task:secret-providers/doppler
            optional: true
          - name: DISCORD_CLIENT_ID
            from: task:secret-providers/doppler
            optional: true
          - name: GITLAB_CLIENT_ID
            from: task:secret-providers/doppler
            optional: true
          - name: GITLAB_CLIENT_SECRET
            from: task:secret-providers/doppler
            optional: true
          - name: AIRTABLE_CLIENT_ID
            from: task:secret-providers/doppler
            optional: true
          - name: AIRTABLE_CLIENT_SECRET
            from: task:secret-providers/doppler
            optional: true
          - name: NOTION_CLIENT_ID
            from: task:secret-providers/doppler
            optional: true
          - name: NOTION_CLIENT_SECRET
            from: task:secret-providers/doppler
            optional: true
          - name: CONFLUENCE_CLIENT_ID
            from: task:secret-providers/doppler
            optional: true
          - name: SALESFORCE_CLIENT_ID
            from: task:secret-providers/doppler
            optional: true
          - name: STRIPE_CLIENT_ID
            from: task:secret-providers/doppler
            optional: true
          - name: STRIPE_CLIENT_SECRET
            from: task:secret-providers/doppler
            optional: true
          - name: OFFICE365_CLIENT_ID
            from: task:secret-providers/doppler
            optional: true
          - name: OFFICE365_CLIENT_SECRET
            from: task:secret-providers/doppler
            optional: true
          - name: AZURE_CLIENT_ID
            from: task:secret-providers/doppler
            optional: true
          - name: AZURE_CLIENT_SECRET
            from: task:secret-providers/doppler
            optional: true

    - task: buildin/write-local
      overrides:
        timeout: 30s
        params:
          content: "${input.output}"
          path: "${DATADIR}/relay/relay.yaml"
          mode: "0600"
        fs:
          - path: "${DATADIR}/relay"
            permission: rw

permissions:
  net:
    - "*"
  fs:
    - path: "${DATADIR}/relay"
      permission: rw
  env:
    - DICODE_DATADIR
    - DICODE_VERSION

notify:
  on_success: false
  on_failure: true
