apiVersion: dicode/v1
kind: Task
name: "Relay Server"
description: >
  Runs dicode-relay in-process under the daemon's Deno runtime. OAuth client
  secrets and the status password come from Doppler via the existing
  buildin/secret-providers/doppler task.

  Set the public base_url via task overrides:
    dicode tasks override buildin/relay-server --param base_url=https://relay.example.com
  (or via the WebUI overrides dialog).

runtime: deno

trigger:
  daemon: true
  restart: always

params:
  base_url:
    type: string
    required: true
    description: >
      Public URL the relay is reachable at (used as the OAuth callback origin).
      No default — override per-host via:
        dicode tasks override buildin/relay-server --param base_url=https://...
      Example: https://relay.example.com (or your Cloudflare Tunnel hostname).

permissions:
  net:
    - "*"
  env:
    # Read-only platform vars (no `from:`) — provided by the daemon at task spawn.
    - DICODE_DATADIR
    - DICODE_VERSION

    # Required secret — task fails fast if absent from Doppler.
    - name: STATUS_PASSWORD
      from: task:secret-providers/doppler

    # OAuth providers — all optional. The relay silently skips any provider
    # whose client_id resolves to empty, so a partial Doppler config still
    # starts a working relay with only the providers you populated.
    # Provider set mirrors relay.yaml.example (dicode-ayo/dicode-relay).
    - name: GITHUB_CLIENT_ID
      from: task:secret-providers/doppler
      optional: true
    - name: GITHUB_CLIENT_SECRET
      from: task:secret-providers/doppler
      optional: true

    - name: SLACK_CLIENT_ID
      from: task:secret-providers/doppler
      optional: true

    - name: GOOGLE_CLIENT_ID
      from: task:secret-providers/doppler
      optional: true
    - name: GOOGLE_CLIENT_SECRET
      from: task:secret-providers/doppler
      optional: true

    - name: SPOTIFY_CLIENT_ID
      from: task:secret-providers/doppler
      optional: true

    - name: LINEAR_CLIENT_ID
      from: task:secret-providers/doppler
      optional: true

    - name: DISCORD_CLIENT_ID
      from: task:secret-providers/doppler
      optional: true

    - name: GITLAB_CLIENT_ID
      from: task:secret-providers/doppler
      optional: true
    - name: GITLAB_CLIENT_SECRET
      from: task:secret-providers/doppler
      optional: true

    - name: AIRTABLE_CLIENT_ID
      from: task:secret-providers/doppler
      optional: true
    - name: AIRTABLE_CLIENT_SECRET
      from: task:secret-providers/doppler
      optional: true

    - name: NOTION_CLIENT_ID
      from: task:secret-providers/doppler
      optional: true
    - name: NOTION_CLIENT_SECRET
      from: task:secret-providers/doppler
      optional: true

    - name: CONFLUENCE_CLIENT_ID
      from: task:secret-providers/doppler
      optional: true

    - name: SALESFORCE_CLIENT_ID
      from: task:secret-providers/doppler
      optional: true

    - name: STRIPE_CLIENT_ID
      from: task:secret-providers/doppler
      optional: true
    - name: STRIPE_CLIENT_SECRET
      from: task:secret-providers/doppler
      optional: true

    - name: OFFICE365_CLIENT_ID
      from: task:secret-providers/doppler
      optional: true
    - name: OFFICE365_CLIENT_SECRET
      from: task:secret-providers/doppler
      optional: true

    - name: AZURE_CLIENT_ID
      from: task:secret-providers/doppler
      optional: true
    - name: AZURE_CLIENT_SECRET
      from: task:secret-providers/doppler
      optional: true

notify:
  on_success: false
  on_failure: true
