apiVersion: dicode/v1
kind: Task
name: "Dev-clone Orphan Sweep"
description: |
  Removes per-fix dev-mode clone directories whose run ID is no longer
  in the set of currently-running auto-fix runs. Mirrors temp-cleanup's
  pattern. No git binary — clones are plain dirs from the daemon's
  perspective; rm -rf via Deno.remove is sufficient.

runtime: deno

trigger:
  cron: "*/15 * * * *"   # every 15 minutes

params:
  dev_clones_root:
    type: string
    # task.ts prefers the DICODE_DATADIR env var over this default; this only
    # applies when the var is somehow absent.
    default: "${DATADIR}/dev-clones"
    description: >
      Root directory containing per-fix clone dirs
      (layout: <root>/<sourceName>/<runID>/). Defaults to the resolved
      data_dir's dev-clones location.

permissions:
  fs:
    # ${DATADIR} expands at load time to the resolved data_dir, covering both
    # the default ~/.dicode and non-standard / Docker deployments.
    - path: "${DATADIR}/dev-clones"
      permission: rw
  env:
    - DICODE_DATADIR
  dicode:
    list_tasks: true
    get_runs: true

timeout: 60s
