apiVersion: dicode/v1
kind: Task
name: "Relay Client"
description: >
  Maintains the WebSocket tunnel to the dicode relay broker so the daemon
  can receive webhooks without a public port. Identity (split P-256 sign +
  decrypt keys) and TOFU broker pin live encrypted-at-rest in the
  configured storage task; sub-keys are derived via dicode.crypto and
  never cross IPC.

runtime: deno

trigger:
  daemon: true
  # Disable engine-level auto-restart. The npm:dicode-relay/client RelayClient
  # already does exponential backoff for WSS reconnects internally, and the
  # task's main loop wraps fatal config/storage errors in its own backoff.
  # Engine-level "always" would tight-loop on a config error (e.g. missing
  # env var) — the in-task loop avoids the wasted Deno startup + IPC handshake.
  restart: never

permissions:
  net:
    - "*"
  env:
    - DICODE_RELAY_SERVER_URL
    - DICODE_RELAY_LOCAL_PORT
    - DICODE_STORAGE_TASK
    - DICODE_DATADIR
    # ws (npm) checks these at import time to decide whether to load optional
    # native addons. Deno's --allow-env sandbox blocks access unless declared.
    - WS_NO_BUFFER_UTIL
    - WS_NO_UTF_8_VALIDATE
  dicode:
    crypto:
      - "dicode/relay-identity/v1"
      - "dicode/relay-broker-pin/v1"
    tasks:
      - buildin/local-storage
