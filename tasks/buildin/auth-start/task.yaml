apiVersion: dicode/v1
kind: Task
name: "OAuth — Start Flow"
description: >
  Starts an OAuth authorization flow by signing a /auth/:provider URL with
  the daemon's relay identity (loaded encrypted from the configured
  storage task, decrypted in-process via dicode.crypto). Prints the URL;
  the user opens it in a browser. The eventual token delivery lands on
  /hooks/oauth-complete where buildin/auth-relay decrypts it and writes
  credentials to the secrets store.
runtime: deno

trigger:
  manual: true

params:
  provider:
    type: string
    required: true
    description: "OAuth provider key (slack, github, google, notion, ...)"
  scope:
    type: string
    default: ""
    description: "Optional space-separated scope override; empty uses broker default"

permissions:
  env:
    - DICODE_RELAY_BROKER_URL
    - DICODE_DATADIR
    - DICODE_STORAGE_TASK
  dicode:
    crypto:
      - "dicode/relay-identity/v1"
    tasks:
      - buildin/local-storage

timeout: 10s

notify:
  on_success: false
  on_failure: true
