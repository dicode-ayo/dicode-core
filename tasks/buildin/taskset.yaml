apiVersion: dicode/v1
kind: TaskSet
metadata:
  name: buildin
spec:
  entries:
    tray:
      ref:
        path: ./tray/task.yaml

    notifications:
      ref:
        path: ./notify/task.yaml

    alert:
      ref:
        path: ./alert/task.yaml

    webui:
      ref:
        path: ./webui/task.yaml

    temp-cleanup:
      ref:
        path: ./temp-cleanup/task.yaml

    dev-clones-cleanup:
      ref:
        path: ./dev-clones-cleanup/task.yaml

    ai-agent:
      ref:
        path: ./ai-agent/task.yaml

    # ─── ai-agent-claude-cli: Claude.ai subscription via the official CLI ──
    # Wraps `claude -p` so dicode tasks can drive Claude with the operator's
    # Pro/Max subscription instead of paying per-token via the API. Requires
    # the `claude` binary on PATH (or CLAUDE_CLI_PATH) and a CLAUDE_CODE_OAUTH_TOKEN
    # secret minted via `claude setup-token`. See task README.md for K8s /
    # Docker / host install paths.
    ai-agent-claude-cli:
      ref:
        path: ./ai-agent-claude-cli/task.yaml

    # ─── dicodai: AI Agent preset for dicode task development ──────────────
    # Override of ai-agent preloaded with the dicode-task-dev + dicode-basics
    # skills and wired to OpenAI as the default provider. Users only need to
    # set OPENAI_API_KEY for the task-detail "AI" chat in the WebUI to work.
    # All provider params (model, base_url, api_key_env) can be overridden
    # by users via their own taskset overrides or dicode.yaml params.
    dicodai:
      ref:
        path: ./ai-agent/task.yaml
      overrides:
        name: "Dicodai (Task Dev AI)"
        description: >
          AI agent preset that helps users develop dicode tasks. Preloaded
          with the dicode-task-dev and dicode-basics skills, defaulting to
          OpenAI's gpt-4o. Set OPENAI_API_KEY in your dicode environment
          before using.
        trigger:
          webhook: /hooks/ai/dicodai
          # auth: true — the chat panel in dc-task-detail is always served
          # inside an authenticated dicode session, so gate the webhook too
          # to keep unauthenticated callers off the OpenAI billing surface.
          auth: true
        params:
          skills: "dicode-task-dev,dicode-basics"
          model: "gpt-4o"
          base_url: "https://api.openai.com/v1"
          api_key_env: "OPENAI_API_KEY"
          system_prompt: |
            You are an AI agent embedded in dicode helping users build
            automation tasks. Users ask you to design, write, and debug
            dicode tasks — small TypeScript (or Python, Docker) programs
            triggered by webhooks, cron, manual runs, or chain events.

            Follow the mandatory workflow from the dicode-task-dev skill:
            inspect existing tasks and secrets first, write task.yaml +
            task.ts + task.test.ts together, validate and test before
            committing. Respect the trigger/permissions schema exactly —
            no hardcoded secrets, one trigger per task, always test.

            When the user pastes a task.yaml / task.ts / task.test.ts,
            review it against the skill's rules and reply with concrete
            fixes or a rewritten file. Keep answers focused; the user
            copies code back to their editor manually.
        env:
          - OPENAI_API_KEY
        net:
          - api.openai.com

    auth-start:
      ref:
        path: ./auth-start/task.yaml

    auth-relay:
      ref:
        path: ./auth-relay/task.yaml

    mcp:
      ref:
        path: ./mcp/task.yaml

    auth-providers:
      ref:
        path: ./auth-providers/task.yaml

    secret-providers/doppler:
      ref:
        path: ./secret-providers/doppler/task.yaml

    local-storage:
      ref:
        path: ./local-storage/task.yaml

    # ─── relay-client: WebSocket tunnel daemon task ──────────────────────────
    # Maintains the persistent WSS connection to the relay broker so the daemon
    # can receive webhooks without a public port. Only active when relay.enabled
    # is true in dicode.yaml (DICODE_RELAY_SERVER_URL env var is set by the
    # daemon when relay is configured).
    relay-client:
      ref:
        path: ./relay-client/task.yaml

    # ─── relay-server: in-process dicode-relay supervisor (PipelineTask) ──────
    # A kind: PipelineTask that renders relay.yaml from Doppler-fed env, writes
    # it to disk, then runs the relay daemon body as the terminal stage:
    #   1. buildin/template      — render relay.yaml from the sibling template
    #   2. buildin/write-local   — persist to ${DATADIR}/relay/relay.yaml
    #   3. buildin/relay-server-body — terminal daemon stage (runs the relay)
    # OAuth client secrets + the status password are scoped to the render
    # stage's env override and resolved via buildin/secret-providers/doppler.
    # BASE_URL is set via the env entry on stage 1 (operators override per-host
    # with a taskset override). See tasks/buildin/relay-server/task.yaml for the
    # full pipeline + env contract.
    relay-server:
      ref:
        path: ./relay-server/task.yaml

    # ─── relay-server-body: the relay daemon body (kind: Task) ────────────────
    # Standalone daemon body that bootstraps the broker signing key and runs
    # dicode-relay, reading the pre-rendered config from ${DATADIR}/relay/
    # relay.yaml. Used as the terminal stage of the relay-server PipelineTask
    # above; runnable on its own (it reads whatever relay.yaml is on disk).
    relay-server-body:
      ref:
        path: ./relay-server-body/task.yaml

    run-inputs-cleanup:
      ref:
        path: ./run-inputs-cleanup/task.yaml

    git-pr:
      ref:
        path: ./git-pr/task.yaml

    auto-fix:
      ref:
        path: ./ai-agent/task.yaml
      overrides:
        name: "Auto-fix on failure"
        description: |
          Diagnoses a failed task run, edits source in a per-fix clone,
          validates via task tests + replay, and either merges to main
          (autonomous) or opens a PR (review). Fired by setting
          on_failure_chain: auto-fix on a target task or in defaults.
        trigger:
          manual: true
        params:
          skills: "dicode-task-dev,dicode-basics,dicode-auto-fix"
          max_tool_iterations: "30"
        timeout: 1800s
        dicode:
          runs_replay:           true
          runs_get_input:        true
          runs_pin_input:        true
          runs_unpin_input:      true
          sources_set_dev_mode:  true
          tasks_test:            true
          git_commit_push:       true
          list_tasks:            true
          get_runs:              true
          tasks:
            - "git-pr"
        fs:
          - path: "${DATADIR}/dev-clones"
            permission: rw
