apiVersion: dicode/v1
kind: TaskSet
metadata:
  name: buildin
spec:
  entries:
    tray:
      ref:
        path: ./tray/task.yaml

    notifications:
      ref:
        path: ./notify/task.yaml

    alert:
      ref:
        path: ./alert/task.yaml

    webui:
      ref:
        path: ./webui/task.yaml

    temp-cleanup:
      ref:
        path: ./temp-cleanup/task.yaml

    dev-clones-cleanup:
      ref:
        path: ./dev-clones-cleanup/task.yaml

    ai-agent:
      ref:
        path: ./ai-agent/task.yaml

    # ─── ai-agent-claude-cli: Claude.ai subscription via the official CLI ──
    # Wraps `claude -p` so dicode tasks can drive Claude with the operator's
    # Pro/Max subscription instead of paying per-token via the API. Requires
    # the `claude` binary on PATH (or CLAUDE_CLI_PATH) and a CLAUDE_CODE_OAUTH_TOKEN
    # secret minted via `claude setup-token`. See task README.md for K8s /
    # Docker / host install paths.
    ai-agent-claude-cli:
      ref:
        path: ./ai-agent-claude-cli/task.yaml

    # ─── dicodai: AI Agent preset for dicode task development ──────────────
    # Override of ai-agent preloaded with the dicode-task-dev + dicode-basics
    # skills and wired to OpenAI as the default provider. Users only need to
    # set OPENAI_API_KEY for the task-detail "AI" chat in the WebUI to work.
    # All provider params (model, base_url, api_key_env) can be overridden
    # by users via their own taskset overrides or dicode.yaml params.
    dicodai:
      ref:
        path: ./ai-agent/task.yaml
      overrides:
        name: "Dicodai (Task Dev AI)"
        description: >
          AI agent preset that helps users develop dicode tasks. Preloaded
          with the dicode-task-dev and dicode-basics skills, defaulting to
          OpenAI's gpt-4o. Set OPENAI_API_KEY in your dicode environment
          before using.
        trigger:
          webhook: /hooks/ai/dicodai
          # auth: true — the chat panel in dc-task-detail is always served
          # inside an authenticated dicode session, so gate the webhook too
          # to keep unauthenticated callers off the OpenAI billing surface.
          auth: true
        params:
          skills: "dicode-task-dev,dicode-basics"
          model: "gpt-4o"
          base_url: "https://api.openai.com/v1"
          api_key_env: "OPENAI_API_KEY"
          system_prompt: |
            You are an AI agent embedded in dicode helping users build
            automation tasks. Users ask you to design, write, and debug
            dicode tasks — small TypeScript (or Python, Docker) programs
            triggered by webhooks, cron, manual runs, or chain events.

            Follow the mandatory workflow from the dicode-task-dev skill:
            inspect existing tasks and secrets first, write task.yaml +
            task.ts + task.test.ts together, validate and test before
            committing. Respect the trigger/permissions schema exactly —
            no hardcoded secrets, one trigger per task, always test.

            When the user pastes a task.yaml / task.ts / task.test.ts,
            review it against the skill's rules and reply with concrete
            fixes or a rewritten file. Keep answers focused; the user
            copies code back to their editor manually.
        env:
          - OPENAI_API_KEY
        net:
          - api.openai.com

    auth-start:
      ref:
        path: ./auth-start/task.yaml

    auth-relay:
      ref:
        path: ./auth-relay/task.yaml

    mcp:
      ref:
        path: ./mcp/task.yaml

    auth-providers:
      ref:
        path: ./auth-providers/task.yaml

    secret-providers/doppler:
      ref:
        path: ./secret-providers/doppler/task.yaml

    local-storage:
      ref:
        path: ./local-storage/task.yaml

    blob-storage:
      ref:
        path: ./blob-storage/task.yaml

    # ─── relay-client: WebSocket tunnel daemon task ──────────────────────────
    # Maintains the persistent WSS connection to the relay broker so the daemon
    # can receive webhooks without a public port. Only active when relay.enabled
    # is true in dicode.yaml (DICODE_RELAY_SERVER_URL env var is set by the
    # daemon when relay is configured).
    relay-client:
      ref:
        path: ./relay-client/task.yaml

    # ─── relay-server: in-process dicode-relay supervisor (PipelineTask) ──────
    # A kind: PipelineTask that renders relay.yaml from Doppler-fed env, writes
    # it to disk, then runs the relay daemon body as the terminal stage:
    #   1. buildin/template      — render relay.yaml from the sibling template
    #   2. buildin/write-local   — persist to ${DATADIR}/relay/relay.yaml
    #   3. buildin/relay-server-body — terminal daemon stage (runs the relay)
    # OAuth client secrets + the status password are scoped to the render
    # stage's env override and resolved via buildin/secret-providers/doppler.
    # BASE_URL is set via the env entry on stage 1 (operators override per-host
    # with a taskset override). See tasks/buildin/relay-server/task.yaml for the
    # full pipeline + env contract.
    relay-server:
      ref:
        path: ./relay-server/task.yaml

    # ─── relay-server-body: the relay daemon body (kind: Task) ────────────────
    # Standalone daemon body that bootstraps the broker signing key and runs
    # dicode-relay, reading the pre-rendered config from ${DATADIR}/relay/
    # relay.yaml. Used as the terminal stage of the relay-server PipelineTask
    # above; runnable on its own (it reads whatever relay.yaml is on disk).
    relay-server-body:
      ref:
        path: ./relay-server-body/task.yaml

    run-inputs-cleanup:
      ref:
        path: ./run-inputs-cleanup/task.yaml

    resume-state-cleanup:
      ref:
        path: ./resume-state-cleanup/task.yaml

    audit-export-loki:
      ref:
        path: ./audit-export-loki/task.yaml

    # ─── write-task-file: the authoring agents' route to disk ──────────────
    # An ai-agent builds its model-facing toolset from list_tasks, so a write
    # task that is not an entry here is invisible to the model and uncallable
    # via run_task. Registering it makes it callable by every task holding
    # dicode.tasks "*", which the ai-agent base grants — the task confines
    # itself accordingly (see its permissions.fs comment). Its one root is the
    # synthesised ai-scratch source, where `dicode task create` scaffolds; a
    # git-backed source's checkout lives in the pull cache (#730) and an
    # operator authoring there declares that root in their own override.
    write-task-file:
      ref:
        path: ./write-task-file/task.yaml

    git-pr:
      ref:
        path: ./git-pr/task.yaml

    auto-fix:
      ref:
        path: ./ai-agent/task.yaml
      overrides:
        name: "Auto-fix on failure"
        description: |
          Diagnoses a failed task run, edits source in a per-fix clone,
          validates via task tests + replay, and either merges to main
          (autonomous) or opens a PR (review). Fired by setting
          on_failure_chain: auto-fix on a target task or in defaults.
        trigger:
          manual: true
        params:
          skills: "dicode-task-dev,dicode-basics,dicode-auto-fix"
          max_tool_iterations: "30"
        timeout: 1800s
        dicode:
          runs_replay:           true
          runs_get_input:        true
          runs_pin_input:        true
          runs_unpin_input:      true
          sources_set_dev_mode:  true
          tasks_test:            true
          git_commit_push:       true
          list_tasks:            true
          get_runs:              true
          tasks:
            - "git-pr"
        fs:
          - path: "${DATADIR}/dev-clones"
            permission: rw

    # ─── task-create: AI-first task scaffolding ─────────────────────────────
    # Override of ai-agent that scaffolds a brand-new task from a natural-
    # language description. This is Phase 0 of docs/design/ai-task-authoring.md
    # ("task create --ai returns a real AI turn") — the AI-authoring
    # counterpart to auto-fix's AI-diagnosis, cloning its exact permission
    # set (dev-mode clones, tasks.test, git-pr landing) because scaffolding a
    # task needs the same sandboxed write → validate → test loop that fixing
    # one does. Fired via FireManual from the IPC control plane
    # (`dicode task create --ai "<prompt>"` / `dicode task edit <id>
    # "<prompt>"`) — trigger stays manual: true, never a webhook, since the
    # authoring session (not an HTTP caller) owns dispatch.
    #
    # Defaults to OpenAI's gpt-4o like dicodai (not auto-fix, which
    # deliberately carries no provider defaults) so it works zero-config with
    # just OPENAI_API_KEY set — cfg.AI.CreateTask documents "buildin/task-create"
    # as the out-of-the-box default other users are expected to just use.
    task-create:
      ref:
        path: ./ai-agent/task.yaml
      overrides:
        name: "Task Create (AI)"
        description: >
          Scaffolds a brand-new dicode task from a natural-language
          description. Writes task.yaml + task.ts/task.js + task.test.ts
          together inside a dev-mode clone, validates the spec, and runs the
          tests before finishing. Fired by `dicode task create --ai` and
          `dicode task edit` via the control socket — see
          docs/design/ai-task-authoring.md (Phase 0).
        trigger:
          manual: true
        params:
          skills: "dicode-task-dev,dicode-basics"
          model: "gpt-4o"
          base_url: "https://api.openai.com/v1"
          api_key_env: "OPENAI_API_KEY"
          max_tool_iterations: "30"
          system_prompt: |
            You are an AI agent embedded in dicode that scaffolds brand-new
            automation tasks from a natural-language description. The user
            describes what they want automated; your job is to create a
            working task from scratch — a small TypeScript (or Python,
            Docker) program triggered by a webhook, cron schedule, manual
            run, or chain event.

            The task's directory already exists on disk, scaffolded and
            registered before you were called; the prompt names it. Your
            tools are the only way you can affect anything — everything
            else you know about dicode is context, not capability.

            Follow this workflow, in order, no exceptions:
            1. Write task.yaml + task.ts (or task.py) + task.test.ts
               together, as one unit — never ship one file without the
               others. One write-task-file call per file (the tool is
               named task_buildin_write-task-file), each taking an
               absolute path inside the task's directory and the entire
               file as content.
            2. Respect the trigger/permissions schema exactly: exactly one
               trigger per task.yaml, no hardcoded secrets (reference
               permissions.env instead), and declare every env var and
               network host the script actually touches.
            3. Never invent a secret name. When the task needs a credential
               you have no evidence exists, name it in your reply as
               something the user must set.
            4. Close by reporting which files you wrote, and state plainly
               what you could not verify — you have no tool that runs the
               task or its tests, so never report them as passing.

            When the description is ambiguous — missing channel, schedule,
            endpoint, or similar — ask one focused clarifying question
            rather than guessing. Keep answers focused on the task at hand;
            the user reviews the scaffolded files (and, on review mode, an
            opened PR) before they land.
        env:
          - OPENAI_API_KEY
        net:
          - api.openai.com
        timeout: 1800s
        dicode:
          runs_replay:           true
          runs_get_input:        true
          runs_pin_input:        true
          runs_unpin_input:      true
          sources_set_dev_mode:  true
          tasks_test:            true
          git_commit_push:       true
          list_tasks:            true
          get_runs:              true
          tasks:
            - "git-pr"
            - "buildin/write-task-file"
        fs:
          - path: "${DATADIR}/dev-clones"
            permission: rw
