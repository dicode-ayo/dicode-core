apiVersion: dicode/v1
kind: Task
name: "Relay Server (daemon body)"
description: |
  The relay daemon body: bootstraps the broker signing key and runs
  dicode-relay in-process under the daemon's Deno runtime.

  This is the terminal stage of the buildin/relay-server PipelineTask.
  The pipeline's earlier stages (buildin/template → buildin/write-local)
  render relay.yaml from Doppler-fed env and persist it to
  ${DATADIR}/relay/relay.yaml before this daemon starts. This body just
  reads that pre-rendered config — OAuth secrets and the status password
  are scoped to the renderer stage, never this task's env.

  Standalone-runnable: because this is a plain kind: Task with
  trigger.daemon, an operator can run it directly (it will read whatever
  relay.yaml is already on disk). The orchestration concern — re-render
  config from fresh secrets before each start — lives in the PipelineTask,
  not here.

runtime: deno

trigger:
  daemon: true
  restart: always

permissions:
  net:
    - "*"
  fs:
    - path: "${DATADIR}/relay"
      permission: rw
  env:
    # "*" grants bare --allow-env so the npm:dicode-relay node-compat import
    # can read whatever process.env keys its transitive deps touch at module
    # init (granting NODE_ENV alone is insufficient — the reads are
    # unpredictable). Bounded by runtime.SubprocessEnv, which forwards only an
    # allowlist and denylists the daemon master/admin keys, so the script can
    # still read only what it already holds. The named entries below stay so
    # their host values are forwarded into the subprocess.
    - "*"
    - DICODE_DATADIR
    - DICODE_VERSION
