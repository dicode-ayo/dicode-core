apiVersion: dicode/v1
kind: Task
name: Hello Python
description: |
  Async Python task showcasing PR #52 SDK additions: async def main(),
  params/kv/log/output *_async variants, and PEP 723 inline dependencies
  (httpx).
runtime: python

trigger:
  manual: true

params:
  name:
    description: Name to greet
    default: "World"
  count:
    description: Run count (shown in greeting)
    default: "1"
  httpbin_url:
    description: HTTP endpoint to GET (httpbin-compatible JSON response). Override in tests to use a local server.
    default: "https://httpbin.org/get"

permissions:
  net:
    - httpbin.org
