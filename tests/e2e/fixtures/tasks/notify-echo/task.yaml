apiVersion: dicode/v1
kind: Task
name: Notify Echo
description: |
  approval.notify_task fixture: wired in dicode-unauth.yaml so every pending
  transition mints a real single-use approve-link token through the daemon's
  own flow (Gate.SetPendingHook -> approvalNotifier.notify -> MintApproveLink
  -> Engine.FireManual) and hands it back as this run's return value. No
  dashboard or API endpoint mints a link directly, so this is the only way to
  obtain one from outside the daemon process.
runtime: deno
trigger:
  manual: true
timeout: 5s
