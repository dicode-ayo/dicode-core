apiVersion: dicode/v1
kind: TaskSet
metadata:
  name: e2e-tests
spec:
  entries:
    hello-manual:
      ref:
        path: FIXTURES_TASKS_DIR/hello-manual/task.yaml
    hello-cron:
      ref:
        path: FIXTURES_TASKS_DIR/hello-cron/task.yaml
    hello-webhook:
      ref:
        path: FIXTURES_TASKS_DIR/hello-webhook/task.yaml
    hello-webhook-secure:
      ref:
        path: FIXTURES_TASKS_DIR/hello-webhook-secure/task.yaml
    hello-webhook-any:
      ref:
        path: FIXTURES_TASKS_DIR/hello-webhook-any/task.yaml
    hello-webhook-any-downgrade:
      ref:
        path: FIXTURES_TASKS_DIR/hello-webhook-any-downgrade/task.yaml
    hello-webhook-any-ts:
      ref:
        path: FIXTURES_TASKS_DIR/hello-webhook-any-ts/task.yaml
    chain-target:
      ref:
        path: FIXTURES_TASKS_DIR/chain-target/task.yaml
    will-fail:
      ref:
        path: FIXTURES_TASKS_DIR/will-fail/task.yaml
    loop-target:
      ref:
        path: FIXTURES_TASKS_DIR/loop-target/task.yaml
    persistence-test:
      ref:
        path: FIXTURES_TASKS_DIR/persistence-test/task.yaml
    suspend-wizard:
      ref:
        path: FIXTURES_TASKS_DIR/suspend-wizard/task.yaml
    load-error-target:
      ref:
        path: FIXTURES_TASKS_DIR/load-error-target/task.yaml
    webui:
      ref:
        path: BUILDIN_WEBUI_TASK_YAML
    mcp:
      ref:
        path: BUILDIN_MCP_TASK_YAML
    auth-providers:
      ref:
        path: BUILDIN_AUTH_PROVIDERS_TASK_YAML
    local-storage:
      ref:
        path: BUILDIN_LOCAL_STORAGE_TASK_YAML
    run-inputs-cleanup:
      ref:
        path: BUILDIN_RUN_INPUTS_CLEANUP_TASK_YAML

    # BYO OAuth fixture: instantiates the generic _oauth-app task with
    # provider-specific overrides. Used by auth-providers.spec.ts to
    # confirm the dashboard auto-discovers _oauth-app inheritors via
    # the `template: dicode.io/oauth-app` marker.
    fixture-oauth:
      ref:
        path: AUTH_OAUTH_APP_TASK_YAML
      overrides:
        name: Fixture OAuth
        trigger:
          webhook: /hooks/fixture-oauth
        params:
          provider:          fixture
          scope:             "test:read"
          token_lifetime:    expires
          color:             "#abc123"
          client_id_env:     CLIENT_ID
          access_token_env:  FIXTURE_ACCESS_TOKEN
        env:
          - { name: CLIENT_ID,            secret: FIXTURE_CLIENT_ID,    optional: true }
          - { name: FIXTURE_ACCESS_TOKEN, secret: FIXTURE_ACCESS_TOKEN, optional: true }
