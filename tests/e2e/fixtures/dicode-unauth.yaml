data_dir: TEMP_DATA_DIR
database:
  path: TEMP_DATA_DIR/data.db
  type: sqlite
log_level: info
execution:
  max_concurrent_tasks: 2
defaults:
  run_inputs:
    # The e2e fixture taskset registers tasks under the "e2e-tests" namespace,
    # so the storage backend task ID is e2e-tests/local-storage rather than
    # the default buildin/local-storage.
    storage_task: e2e-tests/local-storage
server:
  port: 8765
  auth: false
  mcp: true
approval:
  # Wired so approval-review.spec.ts can obtain a real single-use
  # approve-link token through the actual daemon flow (#672 e2e coverage) —
  # there is no dashboard/API endpoint that mints one directly. Fires once
  # per true pending transition suite-wide; the fixture task itself is a
  # near-instant no-op (see notify-echo/task.yaml), so this adds no
  # meaningful load to unrelated specs that also cause tasks to pend.
  notify_task: e2e-tests/notify-echo
spec:
  entries:
    e2e-tests:
      ref:
        path: TEMP_TASKSET_PATH
        watch: true
